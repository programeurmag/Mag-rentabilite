name: Dashboard Ventes GHL

on:
  schedule:
    # 7h-19h heure de Montréal en été (EDT, UTC-4) -> 11h-23h UTC. Cron GitHub
    # Actions ne gère pas le changement d'heure automatiquement (voir
    # rapport_hebdomadaire.yml) : décaler d'une heure (10h-22h UTC) au retour à
    # l'heure normale (EST, UTC-5), début novembre.
    - cron: "0 11-23 * * 1-5"
  workflow_dispatch: {} # permet de lancer le dashboard manuellement depuis l'onglet Actions

permissions:
  contents: write # nécessaire pour committer le cache et la page publiée (docs/)

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer le dashboard
        working-directory: .
        env:
          GHL_PRIVATE_TOKEN: ${{ secrets.GHL_PRIVATE_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
          JOBBER_REFRESH_TOKEN: ${{ secrets.JOBBER_REFRESH_TOKEN }}
        run: python src/dashboard_ventes_ghl.py

      - name: Committer le cache et la page publiée
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache_ventes_ghl.json docs/
          git diff --cached --quiet || git commit -m "Dashboard ventes GHL : maj $(date -u +%FT%TZ)"
          git push
