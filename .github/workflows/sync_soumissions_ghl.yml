name: Sync soumissions Jobber -> GHL

on:
  schedule:
    - cron: "*/15 * * * *" # aux 15 minutes (voir spec, section Architecture)
  workflow_dispatch:
    inputs:
      live:
        description: "Écritures réelles dans GHL (sinon dry-run)"
        type: boolean
        default: false
      since:
        description: "Date de début YYYY-MM-DD (override l'état incrémental)"
        type: string
        default: ""

permissions:
  contents: write # nécessaire pour committer etat_sync_soumissions.json

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Lancer le sync
        working-directory: .
        env:
          JOBBER_CLIENT_ID: ${{ secrets.JOBBER_CLIENT_ID }}
          JOBBER_CLIENT_SECRET: ${{ secrets.JOBBER_CLIENT_SECRET }}
          JOBBER_REFRESH_TOKEN: ${{ secrets.JOBBER_REFRESH_TOKEN }}
          GHL_PRIVATE_TOKEN: ${{ secrets.GHL_PRIVATE_TOKEN }}
          GHL_LOCATION_ID: ${{ secrets.GHL_LOCATION_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.live }}" = "true" ]; then ARGS="$ARGS --live"; fi
          if [ -n "${{ github.event.inputs.since }}" ]; then ARGS="$ARGS --since ${{ github.event.inputs.since }}"; fi
          # Sur le cron planifié (pas de workflow_dispatch), toujours --live : c'est le
          # sync incrémental en continu, le but même de ce workflow.
          if [ "${{ github.event_name }}" = "schedule" ]; then ARGS="$ARGS --live"; fi
          python src/sync_soumissions_ghl.py $ARGS

      - name: Committer le nouvel état
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # N'existe qu'en mode --live (jamais en dry-run, ex. un test manuel sans
          # la case "live" cochée) — sinon "git add" échoue (fatal) sur un fichier
          # inexistant, vu en vrai le 2026-08-01.
          if [ -f etat_sync_soumissions.json ]; then
            git add etat_sync_soumissions.json
            git diff --cached --quiet || git commit -m "Sync soumissions : maj état $(date -u +%FT%TZ)"
          else
            echo "Pas de nouvel état à committer (dry-run ou aucun changement)."
          fi
          # Rebase + retry avant de pousser : ce cron tourne aux 15 minutes et
          # partage le dépôt avec d'autres workflows (dashboard ventes GHL,
          # rapport hebdo) — un commit concurrent entre le checkout et ce push
          # fait échouer le push (non-fast-forward) même après un rebase, si un
          # AUTRE commit atterrit entre le rebase et le push lui-même (vu en
          # vrai le 2026-08-01, puis encore le 2026-08-18 malgré le rebase seul
          # : run #196, échec isolé sans perte de donnée, juste l'avancement de
          # l'état raté — le run suivant s'est corrigé tout seul grâce à
          # l'idempotence). Retry avec re-rebase à chaque tentative.
          reussi=false
          for tentative in 1 2 3 4 5; do
            if git pull --rebase origin main && git push; then
              reussi=true
              break
            fi
            echo "Push échoué (tentative $tentative/5), nouvel essai dans $((tentative * 3))s..."
            git rebase --abort 2>/dev/null || true
            sleep $((tentative * 3))
          done
          $reussi || { echo "Échec du push après 5 tentatives."; exit 1; }
