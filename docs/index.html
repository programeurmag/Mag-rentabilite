<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Dashboard Ventes MAG</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(16px, 2vw, 40px);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: clamp(16px, 1.5vw, 24px);
  }
  h1 { font-size: clamp(22px, 2.4vw, 34px); margin: 0; }
  h2 { font-size: clamp(17px, 1.6vw, 21px); margin: 0 0 14px; }
  .meta { color: #6b7280; font-size: clamp(12px, 0.9vw, 15px); margin-top: 4px; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button {
    border: 1px solid #d1d5db;
    background: #fff;
    color: #374151;
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 13px;
    cursor: pointer;
  }
  .presets button.actif { background: #1f2937; color: #fff; border-color: #1f2937; }
  section { margin-bottom: clamp(20px, 2vw, 32px); }
  .bandeau-equipe {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    background: #ffffff;
    border: 1px solid #e5e7eb;
    border-radius: 14px;
    padding: clamp(14px, 1.6vw, 24px);
  }
  .stat-equipe-label { font-size: clamp(12px, 0.9vw, 14px); color: #6b7280; margin-bottom: 4px; }
  .stat-equipe-valeur { font-size: clamp(20px, 2vw, 28px); font-weight: 600; }
  .grille-vendeurs {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: clamp(14px, 1.6vw, 22px);
  }
  .carte { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: clamp(16px, 1.6vw, 24px); }
  .carte h2 { font-size: clamp(18px, 1.6vw, 22px); }
  .metrique { border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .metrique:last-child { margin-bottom: 0; }
  .metrique-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .metrique-label { font-size: clamp(13px, 1vw, 15px); color: #374151; }
  .metrique-valeur { font-size: clamp(17px, 1.4vw, 21px); font-weight: 700; white-space: nowrap; }
  .conseil { font-size: clamp(12px, 0.9vw, 14px); color: #4b5563; margin-top: 4px; }
  .carte-fond-vert { background: #eaf6ec; }
  .carte-fond-jaune { background: #fdf3e0; }
  .carte-fond-rouge { background: #fbe9e9; }
  .carte-fond-neutre { background: #f1f2f4; }
  .panneau { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: clamp(16px, 1.6vw, 24px); }
  .grille-graphiques { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .graphique-titre { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { color: #6b7280; font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: #fff; }
  tbody tr:hover { background: #f9fafb; }
  .table-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .tabs button.actif { background: #1f2937; color: #fff; border-color: #1f2937; }
  input[type="search"] {
    width: 100%; max-width: 320px; padding: 7px 10px; margin-bottom: 10px;
    border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px;
  }
  .badge-couleur { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
  @media (prefers-color-scheme: dark) {
    body { background: #111214; color: #e8e8ea; }
    .bandeau-equipe, .carte, .panneau { background: #1a1b1e; border-color: #2c2d31; }
    .meta, .stat-equipe-label, .metrique-label, .conseil, .graphique-titre, th { color: #9aa0a6; }
    th { background: #1a1b1e; }
    .presets button, .tabs button { background: #1a1b1e; color: #e8e8ea; border-color: #2c2d31; }
    input[type="search"] { background: #1a1b1e; color: #e8e8ea; border-color: #2c2d31; }
    tbody tr:hover { background: #202124; }
    td, tbody tr { border-color: #2c2d31; }
    .carte-fond-vert { background: #163a1e; }
    .carte-fond-jaune { background: #3a2f10; }
    .carte-fond-rouge { background: #3a1a1a; }
    .carte-fond-neutre { background: #24252a; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Dashboard Ventes — MAG</h1>
    <div class="meta" id="meta">Chargement…</div>
  </div>
  <div class="presets" id="presets">
    <button data-preset="7">7 jours</button>
    <button data-preset="30" class="actif">30 jours</button>
    <button data-preset="90">90 jours</button>
    <button data-preset="mois">Ce mois</button>
  </div>
</header>

<section class="bandeau-equipe" id="bandeau-equipe"></section>

<section class="grille-vendeurs" id="grille-vendeurs"></section>

<section class="panneau">
  <h2>Tendance par semaine</h2>
  <div class="grille-graphiques" id="graphiques-tendance"></div>
</section>

<section class="panneau">
  <h2>Répartition par source de lead</h2>
  <div id="tableau-source"></div>
</section>

<section class="panneau">
  <h2>Classement des vendeurs</h2>
  <div id="leaderboard"></div>
</section>

<section class="panneau">
  <h2>Détail</h2>
  <div class="tabs" id="tabs-detail">
    <button data-tab="leads" class="actif">Leads</button>
    <button data-tab="soumissions">Soumissions</button>
  </div>
  <input type="search" id="recherche" placeholder="Rechercher un nom...">
  <div class="table-scroll" id="tableau-detail"></div>
</section>

<script src="dashboard.js"></script>
</body>
</html>
