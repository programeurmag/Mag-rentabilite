<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="600">
<title>Temporel — Dashboard Ventes MAG</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: clamp(16px, 2vw, 40px);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f7f7f8;
    color: #1a1a1a;
  }
  header { margin-bottom: clamp(14px, 1.5vw, 20px); }
  .entete-haut { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: clamp(20px, 2.2vw, 30px); margin: 0; }
  h2 { font-size: clamp(17px, 1.6vw, 21px); margin: 0 0 14px; }
  .meta { color: #6b7280; font-size: clamp(12px, 0.9vw, 15px); margin-top: 4px; }
  nav.principale { display: flex; gap: 4px; flex-wrap: wrap; margin: 12px 0 18px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
  nav.principale a {
    text-decoration: none; color: #6b7280; font-size: 13px; padding: 6px 12px; border-radius: 8px;
  }
  nav.principale a.actif { background: #1f2937; color: #fff; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .presets button {
    border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 999px;
    padding: 7px 16px; font-size: 13px; cursor: pointer;
  }
  .presets button.actif { background: #1f2937; color: #fff; border-color: #1f2937; }
  section { margin-bottom: clamp(20px, 2vw, 32px); }
  .panneau { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: clamp(16px, 1.6vw, 24px); }
  .bandeau-equipe {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px;
    background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: clamp(14px, 1.6vw, 24px);
  }
  .stat-equipe-label { font-size: clamp(12px, 0.9vw, 14px); color: #6b7280; margin-bottom: 4px; }
  .stat-equipe-valeur { font-size: clamp(20px, 2vw, 28px); font-weight: 600; }
  .grille-vendeurs { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: clamp(14px, 1.6vw, 22px); }
  .carte { background: #ffffff; border: 1px solid #e5e7eb; border-radius: 14px; padding: clamp(16px, 1.6vw, 24px); }
  .carte h2 { font-size: clamp(18px, 1.6vw, 22px); }
  .metrique { border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
  .metrique:last-child { margin-bottom: 0; }
  .metrique-tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .metrique-label { font-size: clamp(13px, 1vw, 15px); color: #374151; }
  .metrique-valeur { font-size: clamp(17px, 1.4vw, 21px); font-weight: 700; white-space: nowrap; }
  .conseil { font-size: clamp(12px, 0.9vw, 14px); color: #4b5563; margin-top: 4px; }
  .carte-fond-vert { background: #eaf6ec; }
  .carte-fond-jaune { background: #fdf3e0; }
  .carte-fond-rouge { background: #fbe9e9; }
  .carte-fond-neutre { background: #f1f2f4; }
  .grille-graphiques { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  .graphique-titre { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eee; white-space: nowrap; }
  th { color: #6b7280; font-weight: 600; cursor: pointer; user-select: none; position: sticky; top: 0; background: #fff; }
  tbody tr:hover { background: #f9fafb; }
  .table-scroll { overflow-x: auto; max-height: 480px; overflow-y: auto; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button {
    border: 1px solid #d1d5db; background: #fff; color: #374151; border-radius: 8px;
    padding: 6px 14px; font-size: 13px; cursor: pointer;
  }
  .tabs button.actif { background: #1f2937; color: #fff; border-color: #1f2937; }
  input[type="search"] {
    width: 100%; max-width: 320px; padding: 7px 10px; margin-bottom: 10px;
    border: 1px solid #d1d5db; border-radius: 8px; font-size: 13px;
  }
  a.lien-ghl { color: #2563eb; text-decoration: none; }
  a.lien-ghl:hover { text-decoration: underline; }
  .grisee { color: #9ca3af; font-style: italic; }
  .badge-manquant { display: inline-block; font-size: 11px; color: #9ca3af; border: 1px dashed #d1d5db; border-radius: 6px; padding: 1px 6px; margin-left: 6px; }
  .funnel-etape { display: flex; align-items: center; gap: 14px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .funnel-etape:last-child { border-bottom: none; }
  .funnel-barre-fond { flex: 1; background: #eef0f2; border-radius: 8px; height: 30px; position: relative; overflow: hidden; }
  .funnel-barre { background: #2563eb; height: 100%; border-radius: 8px; }
  .funnel-nom { width: 150px; font-size: 13px; color: #374151; flex-shrink: 0; }
  .funnel-chiffres { width: 190px; text-align: right; font-size: 13px; flex-shrink: 0; }
  .heatmap-grille { display: grid; grid-template-columns: 50px repeat(24, 1fr); gap: 2px; font-size: 10px; }
  .heatmap-cellule { aspect-ratio: 1; border-radius: 3px; }
  .heatmap-label { display: flex; align-items: center; color: #6b7280; }
  @media (prefers-color-scheme: dark) {
    body { background: #111214; color: #e8e8ea; }
    .bandeau-equipe, .carte, .panneau { background: #1a1b1e; border-color: #2c2d31; }
    .meta, .stat-equipe-label, .metrique-label, .conseil, .graphique-titre, th, .funnel-nom { color: #9aa0a6; }
    th { background: #1a1b1e; }
    .presets button, .tabs button { background: #1a1b1e; color: #e8e8ea; border-color: #2c2d31; }
    input[type="search"] { background: #1a1b1e; color: #e8e8ea; border-color: #2c2d31; }
    tbody tr:hover { background: #202124; }
    td, tbody tr { border-color: #2c2d31; }
    .carte-fond-vert { background: #163a1e; }
    .carte-fond-jaune { background: #3a2f10; }
    .carte-fond-rouge { background: #3a1a1a; }
    .carte-fond-neutre { background: #24252a; }
    nav.principale { border-color: #2c2d31; }
    nav.principale a { color: #9aa0a6; }
    .funnel-barre-fond { background: #24252a; }
  }
</style>
</head>
<body>
<header>
  <div class="entete-haut">
    <div>
      <h1>Temporel — MAG</h1>
      <div class="meta" id="meta">Chargement…</div>
    </div>
  </div>
  <nav class="principale"><a href="index.html" class="">Accueil</a><a href="activite.html" class="">Activité</a><a href="funnel.html" class="">Funnel</a><a href="pipeline.html" class="">Pipeline</a><a href="sources.html" class="">Sources</a><a href="temporel.html" class="actif">Temporel</a></nav>
</header>

<div class="entete-haut" style="margin-bottom:16px">
  <div class="presets" id="presets">
    <button data-preset="7">7 jours</button>
    <button data-preset="30" class="actif">30 jours</button>
    <button data-preset="90">90 jours</button>
    <button data-preset="mois">Ce mois</button>
  </div>
</div>

<section class="panneau">
  <h2>Leads entrants — jour x heure</h2>
  <div id="heatmap"></div>
</section>

<section class="bandeau-equipe" id="bandeau-delais"></section>

<script src="commun.js"></script>
<script src="temporel.js"></script>
</body>
</html>
